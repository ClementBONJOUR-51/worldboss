version: '3.8'

services:
  # Redis for caching and real-time features (optional, disabled by default)
  redis:
    image: redis:7-alpine
    container_name: worldboss_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL for persistence (optional, disabled by default)
  postgres:
    image: postgres:15-alpine
    container_name: worldboss_postgres
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: wb
      POSTGRES_DB: worldboss
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wb"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend API & WebSocket Server
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: worldboss_backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 3001
      BACKEND_LOG_LEVEL: info
      BOSS_NAME: Kraken
      BOSS_MAX_HP: 10000
      BOSS_TICK_INTERVAL: 2000
      # Optional services
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://wb:example@postgres:5432/worldboss
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/boss"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Frontend React App
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: worldboss_frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: 3000
      VITE_WS_URL: ws://localhost:3001
      VITE_API_URL: http://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3

